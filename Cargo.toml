[package]
name = "rapier3d-doodle"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { git = "https://github.com/bevyengine/bevy.git", branch = "main", version = "0.20.0-dev" }
bevy_rapier3d = { version = "0.36.0", features = ["parallel"], git = "https://github.com/dimforge/rapier.git", branch = "master" }

# Enable a medium amount of optimization in the dev profile.
[profile.dev]
opt-level = 2

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
