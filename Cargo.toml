[package]
name = "rapier3d-doodle"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.0"
bevy_rapier3d = "0.37.0"

# Enable a medium amount of optimization in the dev profile.
[profile.dev]
opt-level = 2

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
